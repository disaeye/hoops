[workspace]
resolver = "2"
members = [
    "crates/hoops-core",
    "crates/hoops-config",
    "crates/hoops-output",
    "crates/hoops-audit",
    "crates/hoops-server",
    "crates/hoops-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hoops Engineering"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
libm = "0.2"
sha2 = { version = "0.10", default-features = false }
toml = "0.8"
zstd = "=0.13.2"
zstd-sys = "=2.0.13"
crc32fast = "1.5"
rayon = "1.10"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
futures-util = "0.3"
clap = { version = "4.5", features = ["derive"] }
jsonwebtoken = "9.3"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
hex = "0.4"

[profile.release]
opt-level = 3
codegen-units = 1
lto = false
